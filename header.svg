<svg width="1000" height="290" viewBox="0 0 1000 290" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Suraj Shekhawat - Full-Stack Developer" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b132b"/>
      <stop offset="0.55" stop-color="#1c2541"/>
      <stop offset="1" stop-color="#2b3f63"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5bc0be"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#9ad1d4"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#5bc0be" stroke-width="0.6" opacity="0.18"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5bc0be" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5bc0be" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round"><rect width="1000" height="290" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1000" height="290" fill="url(#bg)"/>
    <rect width="1000" height="290" fill="url(#grid)"/>

    <!-- soft moving glows -->
    <circle cx="180" cy="70" r="170" fill="url(#glow)">
      <animate attributeName="cx" values="180;260;180" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="70;120;70" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="840" cy="230" r="190" fill="url(#glow)">
      <animate attributeName="cx" values="840;760;840" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="230;170;230" dur="11s" repeatCount="indefinite"/>
    </circle>

    <!-- floating particles -->
    <g fill="#5bc0be">
      <circle cx="90" cy="230" r="3" opacity="0.5"><animate attributeName="cy" values="230;40;230" dur="8s" repeatCount="indefinite"/></circle>
      <circle cx="230" cy="250" r="2" opacity="0.4"><animate attributeName="cy" values="250;60;250" dur="10s" repeatCount="indefinite"/></circle>
      <circle cx="390" cy="260" r="3" opacity="0.35"><animate attributeName="cy" values="260;30;260" dur="12s" repeatCount="indefinite"/></circle>
      <circle cx="610" cy="250" r="2.5" opacity="0.45"><animate attributeName="cy" values="250;50;250" dur="9s" repeatCount="indefinite"/></circle>
      <circle cx="780" cy="260" r="3" opacity="0.4"><animate attributeName="cy" values="260;40;260" dur="11s" repeatCount="indefinite"/></circle>
      <circle cx="920" cy="240" r="2" opacity="0.5"><animate attributeName="cy" values="240;70;240" dur="7s" repeatCount="indefinite"/></circle>
    </g>

    <!-- small label -->
    <text x="500" y="62" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="15" letter-spacing="6" fill="#5bc0be" opacity="0">
      &lt; HELLO, WORLD /&gt;
      <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.2s" fill="freeze"/>
    </text>

    <!-- name -->
    <text x="500" y="140" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="68" font-weight="800" fill="url(#name)" opacity="0">
      SURAJ SHEKHAWAT
      <animate attributeName="opacity" values="0;1" dur="1s" begin="0.5s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 18;0 0" dur="1s" begin="0.5s" fill="freeze"/>
    </text>

    <!-- role -->
    <text x="500" y="182" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" letter-spacing="3" fill="#cbd5e1" opacity="0">
      FULL-STACK DEVELOPER  ·  WEB &amp; MOBILE APPS
      <animate attributeName="opacity" values="0;1" dur="1s" begin="1.1s" fill="freeze"/>
    </text>

    <!-- animated underline -->
    <rect x="390" y="198" height="3" rx="1.5" fill="#5bc0be" width="0">
      <animate attributeName="width" values="0;220" dur="1s" begin="1.4s" fill="freeze"/>
    </rect>

    <!-- stack pills -->
    <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">
      <g opacity="0"><rect x="245" y="222" width="70" height="32" rx="16" fill="#0b132b" stroke="#5bc0be" stroke-opacity="0.6"/><text x="280" y="243" fill="#5bc0be">React</text><animate attributeName="opacity" values="0;1" dur="0.6s" begin="1.8s" fill="freeze"/></g>
      <g opacity="0"><rect x="329" y="222" width="80" height="32" rx="16" fill="#0b132b" stroke="#5bc0be" stroke-opacity="0.6"/><text x="369" y="243" fill="#5bc0be">Next.js</text><animate attributeName="opacity" values="0;1" dur="0.6s" begin="2.0s" fill="freeze"/></g>
      <g opacity="0"><rect x="423" y="222" width="84" height="32" rx="16" fill="#0b132b" stroke="#5bc0be" stroke-opacity="0.6"/><text x="465" y="243" fill="#5bc0be">Node.js</text><animate attributeName="opacity" values="0;1" dur="0.6s" begin="2.2s" fill="freeze"/></g>
      <g opacity="0"><rect x="521" y="222" width="120" height="32" rx="16" fill="#0b132b" stroke="#5bc0be" stroke-opacity="0.6"/><text x="581" y="243" fill="#5bc0be">React Native</text><animate attributeName="opacity" values="0;1" dur="0.6s" begin="2.4s" fill="freeze"/></g>
      <g opacity="0"><rect x="655" y="222" width="100" height="32" rx="16" fill="#0b132b" stroke="#5bc0be" stroke-opacity="0.6"/><text x="705" y="243" fill="#5bc0be">MongoDB</text><animate attributeName="opacity" values="0;1" dur="0.6s" begin="2.6s" fill="freeze"/></g>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="999" height="289" rx="18" fill="none" stroke="#5bc0be" stroke-opacity="0.35"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
